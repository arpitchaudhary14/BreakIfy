<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/BreakIfy Logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BreakIfy - Enterprise URL Shortening and Link Management SaaS" />
    <title>BreakIfy — Shorten. Track. Share.</title>
    <!-- Prevent theme flash -->
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('breakify-theme-mode') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (mode === 'dark' || (mode === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-mono-canvas dark:bg-mono-canvas-dark text-mono-text-primary dark:text-mono-text-primary-dark min-h-screen antialiased selection:bg-zinc-900 selection:text-white dark:selection:bg-zinc-100 dark:selection:text-zinc-950 font-sans">
    <!-- Google Identity Services (GIS) for real-time Google OAuth -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
